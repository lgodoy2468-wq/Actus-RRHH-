{% extends "base.html" %}
{% block title %}Nuevo corporativo{% endblock %}
{% block content %}
<h1 style="font-size:1.4rem;margin-bottom:1.25rem;">Nuevo corporativo</h1>
<form method="post">
  <div class="card">
    <div class="form-group">
      <label>Nombre *</label>
      <input type="text" name="nombre" class="form-control" required placeholder="Junior Godoy">
    </div>
    <div class="form-group">
      <label>Observaciones</label>
      <textarea name="observaciones" class="form-control" rows="2"></textarea>
    </div>
  </div>
  <button type="submit" class="btn btn-primary">Registrar</button>
</form>
{% endblock %}
