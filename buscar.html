{% extends "base.html" %}
{% block title %}Buscador – Actus Postulantes{% endblock %}

{% block content %}
<h1 style="font-size:1.4rem;margin-bottom:.35rem;">Buscador de postulantes</h1>
<p style="color:#6b7280;margin-bottom:1.5rem;">Consultá la ficha completa con el número de cédula, sin navegar por otros apartados.</p>

<div class="card" style="max-width:480px;">
  <form method="get">
    <div class="form-group">
      <input type="text" name="cedula" class="form-control" placeholder="Número de cédula, ej. 5.016.942" value="{{ cedula or '' }}" autofocus>
    </div>
    <button type="submit" class="btn btn-primary btn-block"><i class="bi bi-search"></i> Buscar</button>
  </form>
</div>
{% endblock %}
