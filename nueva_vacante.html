{% extends "base.html" %}
{% block title %}Nueva vacante{% endblock %}
{% block content %}
<h1 style="font-size:1.4rem;margin-bottom:1.25rem;">Nueva vacante</h1>
<form method="post">
  <div class="card">
    <div class="form-group">
      <label>Nombre del puesto *</label>
      <input type="text" name="nombre" class="form-control" required placeholder="Cajero">
    </div>
    <div class="form-group">
      <label>Descripción</label>
      <textarea name="descripcion" class="form-control" rows="3"></textarea>
    </div>
    <div class="form-group">
      <label>Corporativo (opcional)</label>
      <select name="corporativo_id" class="form-control">
        <option value="">— Ninguno —</option>
        {% for c in corporativos %}
        <option value="{{ c.id }}">{{ c.nombre }}</option>
        {% endfor %}
      </select>
    </div>
  </div>
  <button type="submit" class="btn btn-primary">Crear vacante</button>
</form>
{% endblock %}
